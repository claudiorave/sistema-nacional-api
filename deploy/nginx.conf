# Sustituir dominio y rutas de certificados antes de instalar en el servidor.
server {
    listen 80;
    server_name nacional.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nacional.example.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nacional.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nacional.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se sobrescribe la cadena recibida del cliente; NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
