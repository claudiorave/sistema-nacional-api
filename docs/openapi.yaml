components:
  schemas:
    AssignmentEnum:
      enum:
      - main
      - support
      type: string
      description: |-
        * `main` - Principal
        * `support` - Apoyo secundario
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        project:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        detail:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - detail
      - id
      - organization
      - project
    Availability:
      type: object
      properties:
        resource_code:
          type: string
        unit:
          type: string
        total_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
      required:
      - available_quantity
      - reserved_quantity
      - resource_code
      - total_quantity
      - unit
    Capability:
      type: object
      properties:
        capability_code:
          type: string
        max_risk_level:
          $ref: '#/components/schemas/RiskLevelEnum'
        allowed_risk_levels:
          type: array
          items:
            type: string
        certification_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - allowed_risk_levels
      - capability_code
      - certification_ids
      - max_risk_level
    CategoryEnum:
      enum:
      - supplies
      - personnel
      - equipment
      type: string
      description: |-
        * `supplies` - Suministros
        * `personnel` - Personal
        * `equipment` - Equipamiento
    Certification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
        certification_type:
          type: string
          format: uuid
        credential_number:
          type: string
          maxLength: 100
        issuer:
          type: string
          maxLength: 160
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - certification_type
      - created_at
      - credential_number
      - id
      - is_current
      - issuer
      - organization
      - revoked_at
      - valid_from
      - valid_until
    CertificationRequest:
      type: object
      properties:
