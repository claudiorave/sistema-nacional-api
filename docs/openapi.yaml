        compromisos en una transacción PostgreSQL. Reevalúa competencia y disponibilidad
        bajo lock. Reintento idéntico: 200; clave reutilizada con otro contenido:
        409.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Clave estable por adjudicación, 1–128 caracteres alfanuméricos,
          guion, punto, dos puntos o guion bajo.
        required: true
