[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["national/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["national"]
omit = ["national/migrations/*", "national/management/*", "national/admin.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
